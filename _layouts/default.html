<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23146B52'/%3E%3Ctext x='12' y='16.5' font-family='monospace' font-size='10' font-weight='700' fill='%23F3F4F8' text-anchor='middle'%3EMS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="mark mono">MS</span>
      <span class="brand-name">MetaSpark Studio</span>
    </a>
    <div class="masthead-right">
      <nav class="site-nav" aria-label="Site">
        <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} class="current"{% endif %}>Home</a>
        <a href="{{ '/privacy-policy.html' | relative_url }}"{% if page.nav == 'privacy' %} class="current"{% endif %}>Privacy Policy</a>
      </nav>
      <div class="nav-actions">
        <a class="btn-ghost" href="https://discord.gg/rk8jMVVWpS" target="_blank" rel="noopener noreferrer">Join Discord</a>
        <a class="btn-solid" href="https://www.meta.com/experiences/profile/27686015457754037/" target="_blank" rel="noopener noreferrer">Meta Horizon Profile</a>
      </div>
    </div>
  </div>
</div>

{{ content }}

<footer>
  <span>© 2026 MetaSpark Studio. All rights reserved.</span>
  <div class="footer-links">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/privacy-policy.html' | relative_url }}">Privacy Policy</a>
    <a href="https://discord.gg/rk8jMVVWpS" target="_blank" rel="noopener noreferrer">Discord</a>
    <a href="https://www.meta.com/experiences/profile/27686015457754037/" target="_blank" rel="noopener noreferrer">Meta Horizon</a>
    <a href="mailto:maryam.sufwan.horizon@gmail.com">maryam.sufwan.horizon@gmail.com</a>
  </div>
</footer>

</body>
</html>
